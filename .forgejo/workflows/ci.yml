name: CI

# Forgejo Actions pipeline (replaces the root Jenkinsfile). Builds the app images
# and publishes them to the git.ucc.dev package registry, gated by a Trivy scan.
# See MIGRATION.md for repo/secret setup and the GitHub push-mirror (phase 2).
#
# Shared conventions across the unchained app repos (kept consistent on purpose):
#   - checkout:  actions/checkout@v4 in every job
#   - trivy:     digest-pinned docker://ghcr.io/aquasecurity/trivy step
#   - build:     docker/* actions + buildx (login/metadata/build-push)
#   - auth:      vars.REGISTRY_USER || github.actor + secrets.PKG_PUSH_TOKEN

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: git.ucc.dev
  REGISTRY_REPO: unchained/age-verified-shop

jobs:
  # Source-dependency scan. Hard-gates on fixable HIGH/CRITICAL (ADR-003). Runs the
  # pinned Trivy image as a docker:// step so the job stays on the Node-capable
  # default runner (the trivy image has no node to host the JS checkout action).
  trivy:
    name: Trivy vuln gate
    runs-on: docker
    steps:
      - uses: actions/checkout@v4
      - name: trivy fs (fixable HIGH/CRITICAL gate)
        uses: docker://ghcr.io/aquasecurity/trivy:0.72.0@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f
        with:
          args: fs --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --ignore-unfixed --no-progress --disable-telemetry .

  # One matrix build job for the two images. build-args are passed in the step (not
  # the matrix) so `vars` resolve reliably; each image ignores args it doesn't
  # declare. NEXT_PUBLIC_* (storefront) are public build-time endpoints seeded from
  # repo Variables — see MIGRATION.md.
  build:
    name: Build ${{ matrix.image }}
    runs-on: docker
    needs: [trivy]
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: engine
            context: ./engine
          - image: storefront
            context: ./storefront
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ vars.REGISTRY_USER || github.actor }}
          password: ${{ secrets.PKG_PUSH_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.REGISTRY_REPO }}/${{ matrix.image }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=${{ github.ref_name }}-latest,enable=${{ github.ref_type == 'branch' }}
            type=raw,value=stable,enable=${{ github.ref_name == 'main' }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          push: true
          provenance: false
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            NEXT_PUBLIC_GRAPHQL_ENDPOINT=${{ vars.NEXT_PUBLIC_GRAPHQL_ENDPOINT }}
            UNCHAINED_ENDPOINT=${{ vars.UNCHAINED_ENDPOINT }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.REGISTRY_REPO }}/${{ matrix.image }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.REGISTRY_REPO }}/${{ matrix.image }}:buildcache,mode=max,ignore-error=true
